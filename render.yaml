services:
  - type: web
    name: orquest-demo
    runtime: docker
    branch: codex/phase10-integration
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: ORQUESTRA_PUBLIC_DEMO
        value: "true"
      - key: ORQUESTRA_MDC_DEMO_ENABLED
        value: "true"
      - key: ORQUESTRA_AI_ENABLED
        value: "false"
      - key: PUBLIC_AI_ENABLED
        value: "false"
      - key: GEMINI_UNBILLED_PROJECT_CONFIRMED
        value: "false"
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_MAX_REQUESTS_PER_PROVIDER
        value: "0"
      - key: AI_MAX_INPUT_CHARS
        value: "6000"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "512"
      - key: AI_TIMEOUT_SECONDS
        value: "20"
